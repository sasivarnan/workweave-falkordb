services:
  - type: web
    name: firsttask
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_SSL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
