name: Verify Workweave
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      graph:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked workweave --help
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/evaluate_impact.py
      - run: uv run --locked python scripts/evaluate_relationships.py
      - run: uv run --locked python scripts/evaluate.py
      - run: uv run --locked python scripts/export_queries.py
      - run: git diff --exit-code docs/CYPHER.md
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run --locked python scripts/check_secrets.py
