services:
  database:
    image: falkordb/falkordb:latest
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec
    volumes:
      - graph-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  portal:
    build: .
    ports:
      - 127.0.0.1:8080:8080
    environment:
      FALKORDB_HOST: database
      FALKORDB_PORT: '6379'
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  graph-data:
