services:
  database:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec
    volumes:
      - graph-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  portal:
    build: .
    ports:
      - 127.0.0.1:8080:8080
    environment:
      FALKORDB_HOST: database
      FALKORDB_PORT: '6379'
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_USAGE_DB: /app/.data/ai-usage.sqlite3
      AI_HOURLY_LIMIT: ${AI_HOURLY_LIMIT:-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-10}
      AI_TOTAL_LIMIT: ${AI_TOTAL_LIMIT:-30}
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    volumes:
      - usage-data:/app/.data
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  graph-data:
  usage-data:
